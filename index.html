<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="app">
        <div class="search-bar">
            <input type="text" id="cityInput" placeholder="Enter City"><button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i>Search</button>
            
        </div>
    
        <div class="container">
            <div class="card card1">
                <div class="weather-effect"></div>
                <div class="blob"></div>
                <div class="content">
                    <i class="fa-solid fa-temperature-three-quarters"></i>
                    <h1 id="temperature">Loading...</h1>
                    <h2 id="cityName">Loading..</h2>
                    <h3 id="weather"></h3>
                    <h3 id="minmax"> </h3>
                </div>
            </div>
            
            <div class="card card2">
                <div class="wind-effect"></div>
                <div class="content">
                    <i class="fa-solid fa-wind"></i>
                    <h2 id="wind">Loading...</h2> 
                    <!-- wind icon, direction, animation -->
                </div>
            </div>
            
            <div class="card card3">
                <div class="blob"></div>
                <i class="fa-solid fa-droplet"></i>
                <h2 id="humidity">Loading...</h2>
                <!-- progress cycle, water wave animation -->
            </div>
            
            <div class="card card4">
                <!-- slider sunrise/sunset -->
                <i class="fa-solid fa-sun"></i>
                <span id="sunrise"></span>
                <div class="sun-track">
                    <div class="sun-progress"></div>
                </div>
                <i class="fa-solid fa-cloud-sun"></i>
                <span id="sunset"></span>
            </div>
            
            <div class="card card5">
                <i class="fa-solid fa-temperature-half"></i>
                <h2 id="feelsLike">Loading...</h2>
            </div>
            
            <div class="card card6">
                <!-- hourly forcast -->
                <div id="forcastContainer"></div>
            </div>
            
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
